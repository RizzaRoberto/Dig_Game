<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scavo in 3D</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body data-screen="start">

<!-- ============ SCHERMATA INIZIALE ============ -->
<section id="screen-start" class="screen">
  <div class="title-block">
    <p class="kicker">Archeologia in realtà mista</p>
    <h1>Scavo in 3D</h1>
    <p class="sub">Libera il reperto dalla roccia, strato dopo strato, senza romperlo.</p>
    <button id="playBtn" class="big">Gioca</button>
  </div>
</section>

<!-- ============ SCELTA DEL LIVELLO ============ -->
<section id="screen-levels" class="screen">
  <div class="levels-wrap">
    <header><button id="levelsBack" class="ghost">← Indietro</button><h2>Scegli il livello</h2></header>
    <div id="levelList"></div>
  </div>
</section>

<!-- ============ INTERFACCIA DI GIOCO ============ -->
<section id="screen-game" class="screen">
  <!-- Colonna sinistra: pannello del reperto + comandi (si impilano senza accavallarsi) -->
  <div id="leftCol">
    <div id="hud" class="panel">
      <h1 id="levelName">Livello</h1>
      <div class="row"><span>Integrità reperto</span><span id="integV">100%</span></div>
      <div class="bar" id="integ"><i></i></div>
      <div class="row"><span>Reperto scoperto</span><span id="expoV">0%</span></div>
      <div class="bar" id="expo"><i></i></div>
      <div class="row"><span>Sotto lo strumento</span><span id="layerV">–</span></div>
    </div>
    <div id="legend" class="panel">
      <ul id="legendList"></ul>
      <label class="row check pc-only"><span>Mostra strumento</span><input type="checkbox" id="showTool" checked></label>
    </div>
  </div>
  <div id="topRight">
    <button id="menuBtn">Livelli</button>
    <button id="arBtn" class="accent">Entra in AR</button>
  </div>
  <div id="toolbar" class="panel">
    <button id="scanBtn">Scanner<small>vedi dentro</small></button>
  </div>
  <div id="msg" class="panel">
    <h2 id="msgT"></h2>
    <div class="stars" id="msgS"></div>
    <span class="badge" id="msgB"></span>
    <p id="msgP"></p>
    <div class="btns">
      <button id="retryBtn">Riprova</button>
      <button id="levelsBtn">Livelli</button>
      <button id="nextBtn" class="accent">Prossimo livello</button>
    </div>
  </div>
</section>

<div id="loading" class="panel">Preparo la roccia…</div>
<div id="note" class="panel"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
