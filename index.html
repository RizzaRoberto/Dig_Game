<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scavo in 3D</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="hud" class="panel">
  <h1>Scavo in 3D</h1>
  <div class="row"><span>Strumento</span><b id="toolName">Trapano</b></div>
  <div class="row"><span>Integrità reperto</span><span id="integV">100%</span></div>
  <div class="bar" id="integ"><i></i></div>
  <div class="row"><span>Reperto scoperto</span><span id="expoV">0%</span></div>
  <div class="bar" id="expo"><i></i></div>
  <div class="row"><span>Tempo</span><span id="timeV">0:00</span></div>
  <div class="row"><span>Sotto lo strumento</span><span id="layerV">–</span></div>
</div>
<div id="topRight">
  <button id="museumBtn">Museo</button>
  <button id="arBtn">Entra in AR</button>
</div>
<div id="note" class="panel"></div>
<div id="loading" class="panel">Preparo la roccia…</div>
<div id="help" class="panel">Clic sinistro: scava · Tasto destro (o Shift+trascina): ruota · Rotellina: zoom · 1-3 strumenti · S scanner · R nuovo scavo</div>
<div id="toolbar" class="panel">
  <button id="scanBtn">Scanner<small>vedi dentro · S</small></button>
</div>
<div id="msg" class="panel">
  <h2 id="msgT"></h2>
  <div class="stars" id="msgS"></div>
  <span class="badge" id="msgB"></span>
  <p id="msgP"></p>
  <button id="again">Nuovo scavo</button>
</div>
<div id="museum" class="panel">
  <h2>Il tuo museo</h2>
  <div id="museumList"></div>
  <button id="museumClose">Chiudi</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
